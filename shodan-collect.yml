name: Shodan Host Collect

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Shodan query"
        required: true
        default: "http.favicon.hash:-1875761561"
      countries:
        description: "ISO country codes, comma-separated. Leave empty to auto-resolve from facets."
        required: false
        default: ""
      auto_countries:
        description: "Auto resolve countries via facets when countries is empty"
        required: true
        type: boolean
        default: true
      pages:
        description: "Pages per country (free keys usually only page 1)"
        required: true
        default: "1"
      max_countries:
        description: "Max countries to query"
        required: true
        default: "30"
      min_count:
        description: "Min facet count when auto-resolving countries"
        required: true
        default: "1"
      delay_ms:
        description: "Delay between API calls (ms)"
        required: true
        default: "1200"
  schedule:
    # Optional weekly run; disable if you do not want cron.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate secrets
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
        run: |
          if [ -z "$SHODAN_API_KEY" ]; then
            echo "::error::Missing repository secret SHODAN_API_KEY. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Collect hosts via Shodan API
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          SHODAN_QUERY: ${{ github.event.inputs.query || 'http.favicon.hash:-1875761561' }}
          SHODAN_COUNTRIES: ${{ github.event.inputs.countries || '' }}
          SHODAN_AUTO_COUNTRIES: ${{ github.event.inputs.auto_countries == 'true' || github.event.inputs.auto_countries == true || github.event_name == 'schedule' }}
          SHODAN_PAGES: ${{ github.event.inputs.pages || '1' }}
          SHODAN_MAX_COUNTRIES: ${{ github.event.inputs.max_countries || '30' }}
          SHODAN_MIN_COUNT: ${{ github.event.inputs.min_count || '1' }}
          SHODAN_DELAY_MS: ${{ github.event.inputs.delay_ms || '1200' }}
          SHODAN_OUT_DIR: out
        run: |
          set -euo pipefail
          mkdir -p out

          # If countries provided, force that list; otherwise auto-resolve.
          EXTRA_ARGS=()
          if [ -n "${SHODAN_COUNTRIES}" ]; then
            EXTRA_ARGS+=(--countries "$SHODAN_COUNTRIES")
          else
            EXTRA_ARGS+=(--auto-countries)
          fi

          node shodan-api-collect.js \
            --query "$SHODAN_QUERY" \
            --pages "$SHODAN_PAGES" \
            --max-countries "$SHODAN_MAX_COUNTRIES" \
            --min-count "$SHODAN_MIN_COUNT" \
            --delay "$SHODAN_DELAY_MS" \
            --out-dir out \
            --out hosts.csv \
            --txt hosts.txt \
            --summary shodan-api-summary.json \
            "${EXTRA_ARGS[@]}"

          echo "---- hosts sample ----"
          head -n 20 out/hosts.txt || true
          echo "---- counts ----"
          wc -l out/hosts.txt out/hosts.csv || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shodan-hosts-${{ github.run_id }}
          path: |
            out/hosts.csv
            out/hosts.txt
            out/shodan-api-summary.json
            out/countries.json
          if-no-files-found: error
          retention-days: 14
